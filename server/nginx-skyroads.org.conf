# /etc/nginx/sites-available/skyroads.org
# Production: the game at https://skyroads.org/ (web/dist copied to
# /web/skyroads; www.skyroads.org redirects there) and the live ghost relay at
# wss://skyroads.org/skyroads-relay (systemd service skyroads-relay, listening
# on a unix socket). The certificate covers skyroads.org and *.skyroads.org.
server {
    listen 80;
    server_name skyroads.org www.skyroads.org;

    return 301 https://skyroads.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.skyroads.org;

    ssl_certificate /etc/letsencrypt/live/skyroads.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyroads.org/privkey.pem;

    return 301 https://skyroads.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name skyroads.org;

    ssl_certificate /etc/letsencrypt/live/skyroads.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyroads.org/privkey.pem;

    access_log /var/log/nginx/skyroads.org.access.log;
    error_log /var/log/nginx/skyroads.org.error.log;

    root /web/skyroads;
    index index.html;

    # The COOP/COEP headers enable WebAssembly threads directly; without them
    # the bundled coi-serviceworker.js adds them and reloads the page once.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        types {
            text/html html;
            application/javascript js;
            application/wasm wasm;
            application/octet-stream data;
        }
    }

    location = /skyroads-relay {
        proxy_pass http://unix:/web/skyroads-relay/skyroads-relay.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # players can sit in the menus for a while between runs
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
