<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyRoads</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkyRoads">
<!-- Re-serves the page with COOP/COEP headers on hosts that cannot set them
     (needed for SharedArrayBuffer / WebAssembly threads). -->
<script src="coi-serviceworker.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9cf;
               font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center;
          justify-content: center; }
  /* 4:3, or in widescreen the window's shape (--arw: the view's width in game
     columns, set by applyWide, over 240 rows) */
  :root { --arw: 4; --arh: 3; }
  html.wide { --arw: 426; --arh: 240; }
  canvas { display: block; outline: none; image-rendering: pixelated;
           width: min(100vw, calc(100vh * var(--arw) / var(--arh))); height: auto;
           aspect-ratio: var(--arw) / var(--arh); flex-shrink: 0; }
  /* widescreen: the 4:3 frame as large as in 4:3 (the view is a little wider
     than the window, see viewWidth, and its sides are cut off) */
  html.wide canvas { width: min(calc(100vh * var(--arw) / 240), calc(100vw * var(--arw) / 320)); }
  .chip { position: absolute; background: rgba(10, 20, 35, .85); color: #9cf;
          border: 1px solid #357; border-radius: 4px; padding: 4px 10px; }
  #status { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 16px; }
  #settings { position: absolute; right: 10px; bottom: 10px; display: flex;
              flex-direction: column; align-items: flex-end; gap: 6px; }
  #settings .chip { position: static; }
  #bar { display: flex; gap: 6px; }
  #gear, .quick { cursor: pointer; font-size: 16px; line-height: 1; padding: 6px 8px; display: flex; }
  #gear, .quick { opacity: .5; }
  #gear svg { width: 18px; height: 18px; fill: currentColor; transition: transform .2s; }
  /* sound / full screen toggles, always beside the gear */
  .quick svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
               stroke-linecap: round; stroke-linejoin: round; }
  .quick:hover, .quick:focus-visible { background: #234; opacity: 1; }
  #settings.open .quick { opacity: 1; }
  .quick:not(.on) .i-on, .quick.on .i-off { display: none; }
  #gear:hover, #settings.open #gear { opacity: 1; }
  #settings.open #gear svg { transform: rotate(60deg); }
  #menu { display: none; flex-direction: column; padding: 4px; min-width: 150px; }
  #settings.open #menu { display: flex; }
  #menu button { all: unset; cursor: pointer; padding: 6px 8px; border-radius: 3px;
                 display: flex; justify-content: space-between; gap: 16px; }
  #menu button:hover, #menu button:focus-visible { background: #234; }
  #menu .state { opacity: .7; }
  #menu button[hidden], #menu form[hidden], #menu .info[hidden] { display: none; }
  #menu .info { padding: 6px 8px; display: flex; justify-content: space-between; gap: 16px; }
  #volume { align-items: center; }
  #volume input { width: 90px; margin: 0; accent-color: #9cf; cursor: pointer; }
  #menu .state { max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #name-form { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px 8px; }
  #name-form .row { display: flex; gap: 6px; }
  #name-input { flex: 1; min-width: 0; width: 11em; font: inherit; color: #dde; background: #0b1524;
                border: 1px solid #357; border-radius: 3px; padding: 4px 6px; outline: none; }
  #name-input:focus { border-color: #6af; }
  #name-form button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 3px; background: #234; }
  #name-form button:hover, #name-form button:focus-visible { background: #2c4a6e; }
  #name-msg { font-size: 11px; opacity: .8; max-width: 15em; }
  #name-msg.error { color: #f99; opacity: 1; }
  #screen { position: relative; flex-shrink: 0; }
  /* players on this road (live ghosts), over the top left of the game */
  #players { position: absolute; left: 1.5%; top: 2%; margin: 0; padding: .35em .6em;
             list-style: none; display: none; pointer-events: none;
             background: rgba(5, 10, 20, .55); border-radius: 4px;
             font: 600 clamp(9px, calc(min(100vw, 133.33vh) * .018), 16px)/1.45 ui-monospace, Menlo, Consolas, monospace;
             color: #dde; text-shadow: 0 1px 2px #000; }
  #players.show { display: block; }
  #players li { display: flex; align-items: center; gap: .5em; white-space: nowrap; }
  #players .dot { width: .75em; height: .75em; border-radius: 50%; flex: none;
                  box-shadow: 0 0 0 1px rgba(0, 0, 0, .6); }
  #players .you { opacity: .75; }
  #players .replay { opacity: .8; font-style: italic; }
  /* wide windows: beside the game, left of its 4:3 edge (see placePlayers) */
  #players.outside { left: auto; right: calc(100% + 12px); top: 12px;
                     font-size: 14px; background: rgba(10, 20, 35, .85); border: 1px solid #357; }
  /* statistics modal */
  #stats { width: min(760px, calc(100vw - 32px)); max-height: 85vh; padding: 0; overflow: hidden;
           background: #0b1524; color: #cde; border: 1px solid #357; border-radius: 6px;
           font: 13px/1.4 system-ui, sans-serif; }
  #stats[open] { display: flex; flex-direction: column; }
  #stats::backdrop { background: rgba(0, 0, 0, .6); }
  #stats header { display: flex; align-items: center; justify-content: space-between;
                  padding: 10px 14px; border-bottom: 1px solid #357; }
  #stats h2 { margin: 0; font-size: 16px; color: #9cf; }
  #stats-close { all: unset; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 6px;
                 border-radius: 3px; }
  #stats-close:hover, #stats-close:focus-visible { background: #234; }
  #stats-body { padding: 12px 14px 14px; overflow: auto; }
  #stats .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                  gap: 10px; margin-bottom: 12px; }
  #stats .card { border: 1px solid #2a3f5c; border-radius: 4px; padding: 8px 10px; }
  #stats h3 { margin: 0 0 6px; font-size: 13px; color: #9cf; }
  #stats dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  #stats dt { opacity: .75; }
  #stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #stats table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #stats th, #stats td { padding: 3px 6px; text-align: right; white-space: nowrap; }
  #stats th { color: #9cf; font-weight: 600; }
  #stats thead tr:first-child th { border-bottom: 1px solid #2a3f5c; }
  #stats thead tr:last-child th { font-weight: 400; opacity: .75; border-bottom: 1px solid #357; }
  #stats td.world { text-align: left; color: #9cf; }
  #stats td.road { text-align: left; opacity: .75; }
  #stats tbody tr.first td { border-top: 1px solid #1c2d44; }
  #stats td.zero { opacity: .35; }
  #stats .sep { border-left: 1px solid #357; }    /* between All time and Personal */
  #stats td.when[data-set] { cursor: help; text-decoration: underline dotted rgba(153, 204, 255, .4); }
  #stats-tip { position: fixed; z-index: 1; pointer-events: none; display: none; white-space: nowrap;
               padding: 4px 8px; border-radius: 4px; background: #1c2d44; color: #dde;
               border: 1px solid #357; font-size: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  #stats td.by { text-align: left; max-width: 10em; overflow: hidden; text-overflow: ellipsis; }
  #stats .note { margin: 0; opacity: .8; }
  /* about (text from about.md, built into about.html) */
  #about { width: min(560px, calc(100vw - 32px)); max-height: 85vh; padding: 0; overflow: hidden;
           background: #0b1524; color: #cde; border: 1px solid #357; border-radius: 6px;
           font: 14px/1.55 system-ui, sans-serif; }
  #about[open] { display: flex; flex-direction: column; }
  #about::backdrop { background: rgba(0, 0, 0, .6); }
  #about header { display: flex; align-items: center; justify-content: space-between;
                  padding: 10px 14px; border-bottom: 1px solid #357; flex: none; }
  #about header h2 { margin: 0; font-size: 16px; color: #9cf; }
  #about .close { all: unset; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
  #about .close:hover, #about .close:focus-visible { background: #234; }
  #about .body { padding: 8px 20px 18px; overflow: auto; line-height: 1.55; }
  #about .body h1 { font-size: 20px; margin: 14px 0 6px; color: #9cf; }
  #about .body h2 { font-size: 15px; margin: 16px 0 4px; color: #9cf; }
  #about .body h3 { font-size: 14px; margin: 14px 0 4px; color: #9cf; }
  #about .body p, #about .body ul, #about .body ol { margin: 0 0 1em; }
  #about .body > :last-child { margin-bottom: 0; }
  #about .body ul, #about .body ol { padding-left: 22px; }
  #about .body a { color: #6cf; }
  #about .body code { font: 12px ui-monospace, Menlo, Consolas, monospace; background: #1c2d44;
                      padding: 1px 4px; border-radius: 3px; }
  #about > .rev { margin: 0; padding: 0 12px 8px; text-align: right; color: #6a7f9c;
                  font: 11px ui-monospace, Menlo, Consolas, monospace; }
  #about .body hr { border: 0; border-top: 1px solid #2a3f5c; margin: 14px 0; }
  /* account (passkeys) */
  #account { width: min(400px, calc(100vw - 32px)); padding: 0; background: #0b1524; color: #cde;
             border: 1px solid #357; border-radius: 6px; font: 14px/1.45 system-ui, sans-serif; }
  #account::backdrop { background: rgba(0, 0, 0, .6); }
  #account header { display: flex; align-items: center; justify-content: space-between;
                    padding: 10px 14px; border-bottom: 1px solid #357; }
  #account h2 { margin: 0; font-size: 16px; color: #9cf; }
  #account .close { all: unset; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
  #account .close:hover, #account .close:focus-visible { background: #234; }
  #account .body { padding: 14px; }
  #account .intro { margin: 0 0 14px; }
  #account .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #account .actions button { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 4px;
                             background: #234; color: #dde; font-weight: 600; }
  #account .actions button.primary { background: #6cf; color: #0b1524; }
  #account .actions button:hover, #account .actions button:focus-visible { filter: brightness(1.2); outline: 2px solid #9cf; outline-offset: 1px; }
  #account .actions button:disabled { opacity: .5; cursor: default; }
  #account .msg { margin: 12px 0 0; min-height: 1.4em; font-size: 12px; opacity: .85; }
  #account .msg.error { color: #f99; opacity: 1; }
  /* congratulations on a new record / personal best */
  #congrats { --accent: #6cf; width: min(360px, calc(100vw - 32px)); padding: 22px 22px 18px;
              background: #0b1524; color: #cde; border: 2px solid var(--accent); border-radius: 8px;
              text-align: center; font: 14px/1.4 system-ui, sans-serif;
              box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent); }
  #congrats.overall { --accent: #f5c542; }
  #congrats::backdrop { background: rgba(0, 0, 0, .55); }
  #congrats .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px;
                     font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
                     color: #0b1524; background: var(--accent); }
  #congrats h2 { margin: 12px 0 2px; font-size: 22px; color: var(--accent); }
  #congrats .kind { margin: 0 0 12px; font-size: 15px; color: #dde; }
  #congrats .road { margin: 0; opacity: .8; }
  #congrats .time { margin: 2px 0 10px; font: 700 34px/1.2 ui-monospace, Menlo, Consolas, monospace;
                    color: #fff; font-variant-numeric: tabular-nums; }
  #congrats .prev { margin: 0; font-size: 12px; opacity: .75; }
  #congrats-ok { all: unset; cursor: pointer; margin-top: 16px; padding: 6px 22px; border-radius: 4px;
                 font-weight: 600; color: #0b1524; background: var(--accent); }
  #congrats-ok:hover, #congrats-ok:focus-visible { filter: brightness(1.15); outline: 2px solid #fff; outline-offset: 2px; }
  #help { margin: 4px 0 0; padding: 6px 8px 4px; border-top: 1px solid #357;
          display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12px; }
  #help dt { opacity: .7; }
  #help dd { margin: 0; }
  /* touch controls (phones and tablets; ?touch=1 / ?touch=0 forces them on / off):
     below the game in portrait, either side of it in landscape */
  .pad { display: none; }
  html.touch { touch-action: manipulation; }
  html.touch body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html.touch #wrap { display: grid; --dpad: clamp(120px, 42vmin, 200px);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  html.touch .pad { display: flex; align-items: center; justify-content: center; gap: 18px; touch-action: none; }
  html.touch #help { display: none; }
  html.touch #settings { top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
                         bottom: auto; flex-direction: column-reverse; }
  @media (orientation: landscape) {
    /* the game gets what is left after both pads, the gaps and the safe areas
       (the notch / Dynamic Island side insets are ~60px each on iPhones) */
    html.touch #wrap { --dpad: clamp(110px, 34vmin, 180px); --gap: 20px;
                       grid-template-columns: 1fr auto 1fr; column-gap: var(--gap); align-items: center; }
    html.touch canvas {
      width: min(calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * var(--arw) / var(--arh)),
                 calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)
                      - 2 * var(--dpad) - 2 * var(--gap) - 16px)); }
    html.touch #pad-act { flex-direction: column-reverse; }
  }
  @media (orientation: portrait) {
    html.touch #wrap { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; align-items: stretch; }
    html.touch #screen { grid-column: 1 / -1; grid-row: 1; }
    html.touch #pad-dir { grid-column: 1; grid-row: 2; }
    html.touch #pad-act { grid-column: 2; grid-row: 2; flex-direction: column-reverse; }
    html.touch canvas { width: 100%; }
  }
  .dpad { position: relative; width: var(--dpad); height: var(--dpad); border-radius: 50%;
          background: rgba(20, 40, 70, .55); border: 1px solid #357; }
  .dpad span { position: absolute; width: 34%; height: 34%; display: flex; align-items: center;
               justify-content: center; border-radius: 30%; color: #9cf; opacity: .75; }
  .dpad svg { width: 55%; height: 55%; fill: currentColor; }
  .dpad .u { left: 33%; top: 3%; }
  .dpad .d { left: 33%; bottom: 3%; } .dpad .d svg { transform: rotate(180deg); }
  .dpad .l { top: 33%; left: 3%; }    .dpad .l svg { transform: rotate(-90deg); }
  .dpad .r { top: 33%; right: 3%; }   .dpad .r svg { transform: rotate(90deg); }
  .dpad span { opacity: .45; transition: opacity .1s; }
  .dpad span.on { opacity: 1; color: #cef; }
  /* the joystick knob follows the finger inside the ring and springs back */
  .dpad::before { content: ""; position: absolute; inset: 22%; border-radius: 50%;
                  border: 1px dashed rgba(120, 170, 230, .25); }
  .knob { position: absolute; left: 29%; top: 29%; width: 42%; height: 42%; border-radius: 50%;
          background: radial-gradient(circle at 38% 32%, #7fb4ee, #3463a3 60%, #1d3a66);
          border: 1px solid #8bc4ff; box-shadow: 0 4px 12px rgba(0, 0, 0, .55), inset 0 -3px 6px rgba(0, 0, 0, .3);
          transition: transform .14s ease-out; pointer-events: none; }
  .dpad.active .knob { transition: none; }
  .pad button { all: unset; display: flex; align-items: center; justify-content: center; color: #9cf;
                background: rgba(20, 40, 70, .55); border: 1px solid #357;
                font: 600 12px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .pad button.on { background: rgba(120, 190, 255, .35); color: #fff; }
  #pad-act .jump { width: calc(var(--dpad) * .6); height: calc(var(--dpad) * .6); border-radius: 50%; font-size: 15px; }
  #pad-act .keys { display: flex; gap: 10px; }
  #pad-act .keys button { padding: 9px 14px; border-radius: 18px; }
</style>
</head>
<body>
<div id="wrap">
<div id="pad-dir" class="pad" aria-hidden="true">
  <div class="dpad">
    <span class="u"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></span>
    <span class="d"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></span>
    <span class="l"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></span>
    <span class="r"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></span>
    <div class="knob"></div>
  </div>
</div>
<div id="screen">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <ul id="players" aria-label="Players on this road"></ul>
</div>
<div id="pad-act" class="pad" aria-hidden="true">
  <div class="keys">
    <button data-key="6" tabindex="-1">Esc</button>
    <button data-key="5" tabindex="-1">Enter</button>
  </div>
  <button class="jump" data-key="4" tabindex="-1">Jump</button>
</div>
</div>
<div id="status" class="chip">Loading…</div>
<dialog id="about" aria-labelledby="about-title">
  <header><h2 id="about-title">About</h2>
    <button class="close" aria-label="Close">&times;</button></header>
  <div class="body"></div>
</dialog>
<dialog id="account" aria-labelledby="account-title">
  <header><h2 id="account-title">Account</h2>
    <button class="close" aria-label="Close">&times;</button></header>
  <div class="body">
    <p class="intro"></p>
    <div class="actions"></div>
    <p class="msg" role="status"></p>
  </div>
</dialog>
<dialog id="congrats" aria-labelledby="congrats-title">
  <span class="badge"></span>
  <h2 id="congrats-title">Congratulations!</h2>
  <p class="kind"></p>
  <p class="road"></p>
  <p class="time"></p>
  <p class="prev"></p>
  <button id="congrats-ok">OK</button>
</dialog>
<dialog id="stats" aria-labelledby="stats-title">
  <header><h2 id="stats-title">Statistics</h2>
    <button id="stats-close" aria-label="Close">&times;</button></header>
  <div id="stats-body"></div>
  <div id="stats-tip" role="tooltip"></div>
</dialog>
<div id="settings">
  <div id="menu" class="chip" role="menu">
    <button id="multi" role="menuitemcheckbox" hidden>Multiplayer <span class="state"></span></button>
    <div id="online" class="info" hidden>Players online <span class="state"></span></div>
    <button id="name-item" role="menuitem" hidden>Name <span class="state"></span></button>
    <form id="name-form" hidden autocomplete="off">
      <div class="row">
        <input id="name-input" maxlength="20" spellcheck="false" autocapitalize="off"
               placeholder="random name" aria-label="Your name" aria-describedby="name-msg">
        <button type="submit">Save</button>
      </div>
      <div id="name-msg"></div>
    </form>
    <button id="wide-item" role="menuitemcheckbox">Widescreen <span class="state"></span></button>
    <div id="volume" class="info"><label for="volume-input">Volume</label>
      <input id="volume-input" type="range" min="0" max="100" step="5" aria-label="Volume"></div>
    <button id="stats-item" role="menuitem" hidden>Statistics</button>
    <button id="account-item" role="menuitem" hidden>Account <span class="state"></span></button>
    <button id="about-item" role="menuitem">About</button>
    <dl id="help">
      <dt>←&nbsp;→</dt><dd>Steer</dd>
      <dt>↑&nbsp;↓</dt><dd>Speed</dd>
      <dt>Space</dt><dd>Jump</dd>
      <dt>Enter</dt><dd>Select</dd>
      <dt id="esc-key">Esc</dt><dd>Back</dd>
      <dt>W</dt><dd>Widescreen</dd>
      <dt>S</dt><dd>Sound</dd>
      <dt>&minus;&nbsp;=</dt><dd>Volume</dd>
    </dl>
  </div>
  <div id="bar">
  <button id="q-fs" class="chip quick" aria-label="Full screen" aria-pressed="false">
    <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5"/><path d="M16 3h5v5"/><path d="M21 16v5h-5"/><path d="M8 21H3v-5"/></svg>
    <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3"/><path d="M21 8h-5V3"/><path d="M16 21v-5h5"/><path d="M3 16h5v5"/></svg>
  </button>
  <button id="q-mute" class="chip quick" aria-label="Sound" aria-pressed="true">
    <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
  </button>
  <button id="gear" class="chip" title="Settings" aria-label="Settings" aria-haspopup="menu"
          aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
</div>
<script>
  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('canvas');

  function audioContext() { return window.Module && Module.SDL2 && Module.SDL2.audioContext; }

  // SDL resumes audio by itself once the page has seen a user gesture; this
  // just does it immediately.
  // typing in a field or using the statistics dialog: not game input
  function typing(e) {
    return !!(e.target && (e.target.tagName === 'INPUT' ||
                           (e.target.closest && e.target.closest('dialog'))));
  }
  // iOS: play through the silent switch like a video does (Safari 17+),
  // instead of the default "ambient" audio the switch mutes
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
  var primed = null;                 // the context a silent buffer was played on
  function unlockAudio(e) {
    var ac = audioContext();
    if (ac && ac.state !== 'running' && !muted) ac.resume();
    if (ac && primed !== ac) {       // iOS starts output only for sound begun in a gesture
      primed = ac;
      try {
        var src = ac.createBufferSource();
        src.buffer = ac.createBuffer(1, 1, ac.sampleRate);
        src.connect(ac.destination);
        src.start(0);
      } catch (err) {}
    }
    if (!typing(e)) canvas.focus();
  }
  // iOS counts touchend / pointerup / click as gestures that may start audio,
  // not touchstart / pointerdown (and the touch pad cancels the click)
  ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, unlockAudio, true);
  });
  window.addEventListener('keydown', function (e) {
    // keep arrows / space from scrolling the page
    if (!typing(e) && [32, 37, 38, 39, 40].indexOf(e.keyCode) >= 0) e.preventDefault();
  }, true);

  // ---- touch controls: the on-screen pad presses the game's keys ----
  var touchUI = (function () {
    var force = new URLSearchParams(location.search).get('touch');
    return force !== null ? force !== '0'
                          : matchMedia('(hover: none) and (pointer: coarse)').matches;
  })();
  if (touchUI) (function () {
    document.documentElement.classList.add('touch');
    var held = {};                       // key -> { source: 1 } (a key is down while any source holds it)
    function hold(key, src, on) {
      var s = held[key] || (held[key] = {});
      var was = Object.keys(s).length > 0;
      if (on) s[src] = 1; else delete s[src];
      var now = Object.keys(s).length > 0;
      if (was !== now && typeof Module._sky_touch_key === 'function') Module._sky_touch_key(key, now ? 1 : 0);
    }
    document.querySelectorAll('.pad').forEach(function (el) {
      el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });

    // buttons: Jump (space), Enter, Esc; several fingers may hold one button
    document.querySelectorAll('.pad button[data-key]').forEach(function (b) {
      var key = +b.dataset.key, fingers = {};
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        try { b.setPointerCapture(e.pointerId); } catch (err) {}
        fingers[e.pointerId] = 1;
        b.classList.add('on');
        hold(key, 'b' + e.pointerId, true);
      });
      function lift(e) {
        if (!(e.pointerId in fingers)) return;
        delete fingers[e.pointerId];
        if (!Object.keys(fingers).length) b.classList.remove('on');
        hold(key, 'b' + e.pointerId, false);
      }
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { b.addEventListener(ev, lift); });
    });

    // joystick: one finger anywhere on the left pad moves the knob (kept inside
    // the ring); its angle picks the arrows, and the 30-degree wedges between
    // two arrows press both (accelerate and steer at once)
    var padDir = document.getElementById('pad-dir');
    var dpad = padDir.querySelector('.dpad'), knob = dpad.querySelector('.knob');
    var dirs = { u: 0, d: 1, l: 2, r: 3 }, cur = {}, finger = null;
    function aim(e) {
      var want = {}, kx = 0, ky = 0;
      if (e) {
        var r = dpad.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1;
        var len = Math.sqrt(x * x + y * y);
        var reach = Math.min(len, 1) / (len || 1) * r.width * 0.29;   // knob travel: ring minus knob
        kx = x * reach; ky = y * reach;
        if (len > 0.2) {
          x /= len; y /= len;
          if (x > 0.5) want.r = 1; else if (x < -0.5) want.l = 1;
          if (y > 0.5) want.d = 1; else if (y < -0.5) want.u = 1;
        }
      }
      knob.style.transform = 'translate(' + kx.toFixed(1) + 'px, ' + ky.toFixed(1) + 'px)';
      dpad.classList.toggle('active', !!e);
      for (var k in dirs) {
        if (!!want[k] === !!cur[k]) continue;
        hold(dirs[k], 'dpad', !!want[k]);
        dpad.querySelector('.' + k).classList.toggle('on', !!want[k]);
      }
      cur = want;
    }
    padDir.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (finger !== null) return;
      finger = e.pointerId;
      try { padDir.setPointerCapture(e.pointerId); } catch (err) {}
      aim(e);
    });
    padDir.addEventListener('pointermove', function (e) { if (e.pointerId === finger) aim(e); });
    function release(e) { if (e.pointerId === finger) { finger = null; aim(null); } }
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { padDir.addEventListener(ev, release); });

    // let go of everything when the page is hidden
    function releaseAll() {
      finger = null; aim(null);
      for (var key in held) for (var src in held[key]) hold(+key, src, false);
      document.querySelectorAll('.pad .on').forEach(function (el) { el.classList.remove('on'); });
    }
    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });
  })();

  // ---- settings menu (full screen and sound are the icons beside the gear) ----
  var settingsEl = document.getElementById('settings');
  var gearEl = document.getElementById('gear');
  var qFsEl = document.getElementById('q-fs');
  var qMuteEl = document.getElementById('q-mute');
  var muted = true;              // mirrors the game's own sound setting: off
  try { muted = localStorage.getItem('skyroads.sound') !== 'on'; } catch (e) {}   // until on

  function setMenuOpen(open) {
    if (!open) closeNameForm();
    settingsEl.classList.toggle('open', open);
    gearEl.setAttribute('aria-expanded', open);
    if (!open) canvas.focus();  // keep Space/Enter going to the game, not a button
  }
  gearEl.addEventListener('click', function (e) {
    e.stopPropagation();
    updateMultiItem();
    updateOnlineItem();
    updateNameItem();
    statsItemEl.hidden = typeof Module.skyGhostStats !== 'function' ||
                         !Module.skyGhostMultiplayer();     // kept by the relay
    updateAccountItem();
    setMenuOpen(!settingsEl.classList.contains('open'));
  });
  document.addEventListener('click', function (e) {
    if (!settingsEl.contains(e.target)) setMenuOpen(false);
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFsItem() {
    var on = isFullscreen();
    qFsEl.classList.toggle('on', on);
    qFsEl.setAttribute('aria-pressed', on);
    qFsEl.title = on ? 'Exit full screen' : 'Full screen';
    // in full screen the browser keeps Esc (it leaves full screen): ` is Esc
    document.getElementById('esc-key').textContent = on ? '`' : 'Esc';
  }
  // iPhone Safari has no Fullscreen API for pages (Add to Home Screen opens
  // the game full screen instead, see manifest.webmanifest), so no icon there
  var rootEl = document.documentElement;
  var canFullscreen = !!((document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
                         (rootEl.requestFullscreen || rootEl.webkitRequestFullscreen));
  if (!canFullscreen) qFsEl.remove();
  function toggleFullscreen() {
    try {
      var p = isFullscreen()
        ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
        : (rootEl.requestFullscreen || rootEl.webkitRequestFullscreen).call(rootEl);
      if (p && p.catch) p.catch(function () {});
    } catch (err) {}
  }
  qFsEl.addEventListener('click', function () {
    toggleFullscreen();
    canvas.focus();             // keep Space/Enter going to the game, not the button
  });
  document.addEventListener('fullscreenchange', updateFsItem);
  document.addEventListener('webkitfullscreenchange', updateFsItem);

  // Sound is the game's own setting (Controls screen, saved in skyroads.cfg):
  // the menu asks the game to switch it (applied on the game thread, see
  // sound_poll in port/runtime.c) and follows it, so changing it in the
  // Controls screen updates the menu too.
  var soundWanted = null;       // requested, not yet applied by the game
  function gameSoundOn() {        // (-1 until the game has read its settings)
    var on = typeof Module._sky_sound_on === 'function' ? Module._sky_sound_on() : -1;
    return on < 0 ? !muted : !!on;
  }
  function syncSound() {
    var on = gameSoundOn();
    if (soundWanted !== null) {
      if (on === soundWanted) soundWanted = null;
      else on = soundWanted;    // show the request until the game applies it
    }
    if (muted !== !on) { muted = !on; updateMuteItem(); }
    else applyMute();             // SDL resumes the context on its own gestures
  }
  // with the sound off, stop the page's audio output too, so the browser
  // (tab speaker icon, iOS now-playing) no longer counts the page as playing
  // The music plays on silently (sky_audio_mute keeps the chip up to date)
  // and continues where it is when the sound comes back on.
  var outMuted = false;
  function applyMute() {
    var ac = audioContext();
    if (!ac) return;
    if (muted !== outMuted && typeof Module._sky_audio_mute === 'function') {
      outMuted = muted;
      Module._sky_audio_mute(muted ? 1 : 0);
    }
    if (muted && ac.state === 'running') ac.suspend();
    else if (!muted && ac.state === 'suspended' && primed === ac) ac.resume();
  }
  // keep the output stopped from the moment SDL makes it, before the game
  // starts (its intro sample plays whatever the setting, as in the original)
  var earlyMute = setInterval(applyMute, 50);
  function updateMuteItem() {
    applyMute();
    applyVolume();
    qMuteEl.classList.toggle('on', !muted);
    qMuteEl.setAttribute('aria-pressed', !muted);
    qMuteEl.title = muted ? 'Sound off' : 'Sound on';
  }
  function toggleMute() {
    muted = !muted;
    soundWanted = !muted;
    if (typeof Module._sky_set_sound === 'function') Module._sky_set_sound(muted ? 0 : 1);
    updateMuteItem();
  }
  qMuteEl.addEventListener('click', function () {
    toggleMute();
    canvas.focus();             // (the menu stays as it is: its slider follows)
  });
  updateFsItem();
  updateMuteItem();

  // Multiplayer (live ghosts of other players, see live-ghosts.js) or single
  // player (no connection, no ghosts).  Only offered when a relay is
  // configured.
  var multiEl = document.getElementById('multi');
  function updateMultiItem() {
    var available = typeof Module.skyGhostMultiplayer === 'function';
    multiEl.hidden = !available;
    if (!available) return;
    var on = Module.skyGhostMultiplayer();
    multiEl.querySelector('.state').textContent = on ? 'On' : 'Off';
    multiEl.setAttribute('aria-checked', on);
  }
  multiEl.addEventListener('click', function () {
    Module.skyGhostSetMultiplayer(!Module.skyGhostMultiplayer());
    updateMultiItem();
    setMenuOpen(false);
  });

  // Widescreen: the game in the middle of a view as wide as the window (up to
  // ultrawide, 3440x1440), the road's backdrop painted out either side during
  // a run.  On by default; switching it off is remembered in this browser.
  var wideEl = document.getElementById('wide-item');
  var wide = true;                // on unless switched off in this browser
  try { wide = localStorage.getItem('skyroads.wide') !== '0'; } catch (e) {}
  function updateWideItem() {
    wideEl.querySelector('.state').textContent = wide ? 'On' : 'Off';
    wideEl.setAttribute('aria-checked', wide);
  }
  // the view's width in game columns (240 rows tall): the window's shape,
  // from 4:3 up to the widest painted backdrop; 16:9 at most beside the pads.
  // Even, so the margins match and the frame stays in the middle, and rounded
  // up: the frame is as large as in 4:3 and keeps its place when widescreen
  // is switched (the canvas is cut off at the sides by under a column)
  function viewWidth() {
    var max = window.Module && typeof Module._plat_max_view_width === 'function'
              ? Module._plat_max_view_width() : 573;
    if (touchUI) max = Math.min(max, 426);
    max -= max % 2;
    var w = 2 * Math.ceil(120 * window.innerWidth / window.innerHeight - 1e-6);
    return Math.max(320, Math.min(max, w));
  }
  var viewW = 320;
  function applyWide() {
    viewW = wide ? viewWidth() : 320;
    var root = document.documentElement;
    root.classList.toggle('wide', wide);
    root.style.setProperty('--arw', wide ? viewW : 4);
    root.style.setProperty('--arh', wide ? 240 : 3);
    if (window.Module && typeof Module._plat_set_wide === 'function') {
      Module._plat_set_wide(wide ? 1 : 0);
      Module._plat_set_view_width(viewW);
    }
    placePlayers();
  }
  function toggleWide() {
    wide = !wide;
    try { localStorage.setItem('skyroads.wide', wide ? '1' : '0'); } catch (e) {}
    updateWideItem();
    applyWide();
  }
  wideEl.addEventListener('click', function () {
    toggleWide();
    setMenuOpen(false);
  });
  // Volume, 1-100 (the game scales its output by (v / 100)^2; 100 is the
  // level it used to play at), remembered in this browser.  The slider
  // shows 0 while the sound is off: moving it up turns the sound back on,
  // down to 0 turns it off (the volume is kept for when it comes back).
  var volumeEl = document.getElementById('volume-input');
  var volume = 60;
  try {
    var savedVolume = parseInt(localStorage.getItem('skyroads.volume'), 10);
    if (savedVolume > 0 && savedVolume <= 100) volume = savedVolume;
  } catch (e) {}
  function applyVolume() {
    if (!volumeEl) return;              // (updateMuteItem runs before this is set up)
    volumeEl.value = muted ? 0 : volume;
    volumeEl.title = muted ? 'Sound off' : volume + '%';
    if (window.Module && typeof Module._sky_set_volume === 'function') Module._sky_set_volume(volume);
  }
  function changeVolume(v) {            // the slider or - / =
    v = Math.max(0, Math.min(100, Math.round(v)));
    if (v === 0) {
      if (!muted) toggleMute();
    } else {
      volume = v;
      try { localStorage.setItem('skyroads.volume', String(volume)); } catch (e) {}
      if (muted) toggleMute();
    }
    applyVolume();
  }
  volumeEl.addEventListener('input', function () { changeVolume(+volumeEl.value); });
  volumeEl.addEventListener('keydown', function (e) { e.stopPropagation(); });   // not game input
  applyVolume();

  // keyboard: W switches widescreen, S the sound, - and = the volume (the game
  // uses none of them; kept from the game so it does not see them), and `
  // is Esc (which in full screen the browser keeps to leave full screen)
  ['keydown', 'keyup'].forEach(function (type) {
    window.addEventListener(type, function (e) {
      if (typing(e) || e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.code === 'Backquote' || e.key === '`') {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat && typeof Module._sky_touch_key === 'function')
          Module._sky_touch_key(6, type === 'keydown' ? 1 : 0);   // Esc
        return;
      }
      var k = e.key && e.key.toLowerCase();
      if (k !== 'w' && k !== 's' && k !== '-' && k !== '=' && k !== '+') return;
      e.stopImmediatePropagation();
      e.preventDefault();
      if (type !== 'keydown') return;
      if (k === '-' || k === '=' || k === '+') {
        changeVolume((muted ? 0 : volume) + (k === '-' ? -10 : 10));
        return;
      }
      if (e.repeat) return;
      if (k === 'w') toggleWide();
      else toggleMute();
    }, true);
  });
  updateWideItem();
  window.addEventListener('resize', applyWide);
  document.addEventListener('fullscreenchange', applyWide);

  // The player list goes left of the game when the space beside it is wide
  // enough (live-ghosts.js calls this when the list changes), else over the
  // game's top left corner.
  var playersEl = document.getElementById('players');
  function placePlayers() {
    if (!playersEl.classList.contains('show')) return;
    // widescreen: the 4:3 game is the middle of the canvas, the backdrop
    // runs out to its edges, so "beside the game" is inside the canvas
    var rect = canvas.getBoundingClientRect();
    var inset = viewW > 320 ? rect.width * (viewW - 320) / viewW / 2 : 0;
    playersEl.style.right = playersEl.style.left = '';
    if (touchUI) {                                // the pads are beside the game
      playersEl.classList.remove('outside');
    } else {
      playersEl.classList.add('outside');         // measure it in that style
      if (rect.left + inset < playersEl.offsetWidth + 24)
        playersEl.classList.remove('outside');
    }
    if (!inset) return;
    if (playersEl.classList.contains('outside'))
      playersEl.style.right = 'calc(100% - ' + inset + 'px + 12px)';
    else
      playersEl.style.left = 'calc(' + inset + 'px + 1.5%)';
  }
  window.skyPlacePlayers = placePlayers;
  applyWide();                                    // the saved choice, before the game starts
  window.addEventListener('resize', placePlayers);
  document.addEventListener('fullscreenchange', placePlayers);

  // How many players are connected to the relay (only while connected).
  var onlineEl = document.getElementById('online');
  function updateOnlineItem() {
    var n = typeof Module.skyGhostOnline === 'function' ? Module.skyGhostOnline() : null;
    onlineEl.hidden = n === null;
    if (n !== null) onlineEl.querySelector('.state').textContent = String(n);
  }
  window.skyOnlineChanged = updateOnlineItem;

  // Statistics, kept by the relay (all players and you).
  var statsItemEl = document.getElementById('stats-item');
  var statsEl = document.getElementById('stats');
  var statsBodyEl = document.getElementById('stats-body');
  var WORLDS = ['Red Heat', 'Into the Sun', 'Blue Planet', 'Satellite', 'Misty',
                'Asteroid Belt', 'Crab Nebula', 'Over the Base', 'The Earth', 'Druidia'];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function num(n) { return (n | 0).toLocaleString(); }
  function duration(sec) {
    sec = Math.round(sec || 0);
    var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + s + 's' : s + 's';
  }
  function cell(n, cls) {
    cls = (cls ? cls + ' ' : '') + (n ? '' : 'zero');
    return '<td' + (cls.trim() ? ' class="' + cls.trim() + '"' : '') + '>' + num(n) + '</td>';
  }
  function setAt(at) {              // tooltip: when a fastest time was set
    if (!at) return '';
    var d = new Date(at * 1000);
    return ' data-set="Set ' + esc(d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })) + '"';
  }
  function laptime(sec) {           // 1:23.45
    var m = Math.floor(sec / 60), s = (sec - m * 60).toFixed(2);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function renderStats(st) {
    if (!st) {
      statsBodyEl.innerHTML = '<p class="note">Statistics are kept by the multiplayer server. ' +
        'Switch Multiplayer on in the settings to see them.</p>';
      return;
    }
    var a = st.all, y = st.you, html = '<div class="cards">' +
      '<div class="card"><h3>All time</h3><dl>' +
        '<dt>Players</dt><dd>' + num(a.players) + '</dd>' +
        '<dt>Roads attempted</dt><dd>' + num(a.attempts) + '</dd>' +
        '<dt>Roads completed</dt><dd>' + num(a.completions) + '</dd>' +
        '<dt>Time playing</dt><dd>' + duration(a.seconds) + '</dd></dl></div>' +
      '<div class="card"><h3>Personal</h3><dl>' +
        '<dt>Roads attempted</dt><dd>' + num(y.attempts) + '</dd>' +
        '<dt>Roads completed</dt><dd>' + num(y.completions) + '</dd>' +
        '<dt>Time playing</dt><dd>' + duration(y.seconds) + '</dd></dl></div></div>' +
      '<table><thead><tr><th colspan="2"></th><th colspan="4">All time</th><th colspan="3" class="sep">Personal</th></tr>' +
      '<tr><th colspan="2" style="text-align:left">Road</th><th>Attempts</th><th>Completed</th>' +
      '<th>Fastest</th><th style="text-align:left">By</th>' +
      '<th class="sep">Attempts</th><th>Completed</th><th>Fastest</th></tr></thead><tbody>';
    for (var r = 0; r < 30; r++) {
      var ar = a.roads[r] || [0, 0], yr = y.roads[r] || [0, 0], best = (a.best || [])[r];
      var mine = (y.best || [])[r];
      html += '<tr' + (r % 3 ? '' : ' class="first"') + '>' +
        (r % 3 ? '' : '<td class="world" rowspan="3">' + esc(WORLDS[r / 3 | 0]) + '</td>') +
        '<td class="road">Road ' + (r % 3 + 1) + '</td>' +
        cell(ar[0]) + cell(ar[1]) +
        (best ? '<td class="when"' + setAt(best[2]) + '>' + laptime(best[0]) + '</td>' +
                '<td class="by" title="' + esc(best[1]) + '">' + esc(best[1]) + '</td>'
              : '<td class="zero">\u2013</td><td class="zero by"></td>') +
        cell(yr[0], 'sep') + cell(yr[1]) +
        (mine ? '<td class="when"' + setAt(mine[1]) + '>' + laptime(mine[0]) + '</td>'
              : '<td class="zero">\u2013</td>') + '</tr>';
    }
    statsBodyEl.innerHTML = html + '</tbody></table>';
  }
  statsItemEl.addEventListener('click', function () {
    setMenuOpen(false);
    statsBodyEl.innerHTML = '<p class="note">Loading\u2026</p>';
    statsEl.showModal();
    Module.skyGhostStats(renderStats);
  });
  document.getElementById('stats-close').addEventListener('click', function () { statsEl.close(); });
  statsEl.addEventListener('click', function (e) { if (e.target === statsEl) statsEl.close(); });
  statsEl.addEventListener('keydown', function (e) { e.stopPropagation(); });   // not game input
  statsEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  statsEl.addEventListener('close', function () { hideTip(); canvas.focus(); });

  // "Set <date>" above a fastest time while it is hovered (or tapped)
  var tipEl = document.getElementById('stats-tip');
  function showTip(td) {
    var r = td.getBoundingClientRect();
    tipEl.textContent = td.getAttribute('data-set');
    tipEl.style.display = 'block';
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    var y = r.top - h - 6;
    if (y < 8) y = r.bottom + 6;                  // no room above: below
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
  }
  function hideTip() { tipEl.style.display = 'none'; }
  function tipCell(e) { return e.target.closest && e.target.closest('td[data-set]'); }
  statsBodyEl.addEventListener('mouseover', function (e) { var td = tipCell(e); if (td) showTip(td); });
  statsBodyEl.addEventListener('mouseout', function (e) { if (tipCell(e)) hideTip(); });
  statsBodyEl.addEventListener('click', function (e) { var td = tipCell(e); if (td) showTip(td); else hideTip(); });
  statsBodyEl.addEventListener('scroll', hideTip);

  // About: the text of about.md (built into about.html by the Makefile)
  var aboutEl = document.getElementById('about');
  var aboutBodyEl = aboutEl.querySelector('.body');
  var aboutLoaded = false;
  document.getElementById('about-item').addEventListener('click', function () {
    setMenuOpen(false);
    if (!aboutLoaded) {
      aboutBodyEl.innerHTML = '<p>Loading\u2026</p>';
      fetch('about.html').then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (text) {
        aboutBodyEl.innerHTML = text;   // generated from about.md, escaped by gen_about.py
        var rev = aboutBodyEl.querySelector('.rev');
        if (rev) aboutEl.appendChild(rev);   // the build's revision, lower right
        aboutLoaded = true;
      }, function () {
        aboutBodyEl.innerHTML = '<p>Could not load the About text.</p>';
      });
    }
    aboutEl.showModal();
    aboutEl.querySelector('.close').focus();
  });
  aboutEl.querySelector('.close').addEventListener('click', function () { aboutEl.close(); });
  aboutEl.addEventListener('click', function (e) { if (e.target === aboutEl) aboutEl.close(); });
  aboutEl.addEventListener('keydown', function (e) { e.stopPropagation(); });   // not game input
  aboutEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  aboutEl.addEventListener('close', function () { canvas.focus(); });

  // Account: create one with a passkey, sign in with it elsewhere; while
  // signed in your name, settings, road completions and statistics follow
  // you (live-ghosts.js and server/relay.py).
  var accountItemEl = document.getElementById('account-item');
  var accountEl = document.getElementById('account');
  var accountMsgEl = accountEl.querySelector('.msg');
  function accountState() { return typeof Module.skyAccount === 'function' ? Module.skyAccount() : null; }
  function updateAccountItem() {
    var a = accountState();
    accountItemEl.hidden = !a || !a.available || !Module.skyGhostMultiplayer();
    if (a) accountItemEl.querySelector('.state').textContent = a.signedIn ? 'Signed in' : 'Sign in';
  }
  function accountMessage(text, error) {
    accountMsgEl.textContent = text || '';
    accountMsgEl.classList.toggle('error', !!error);
  }
  function accountButton(label, primary, onclick) {
    var b = document.createElement('button');
    b.textContent = label;
    if (primary) b.className = 'primary';
    b.addEventListener('click', onclick);
    return b;
  }
  function passkey(action, busy, done) {
    var buttons = accountEl.querySelectorAll('.actions button');
    buttons.forEach(function (b) { b.disabled = true; });
    accountMessage(busy);
    Module.skyPasskey(action, function (err) {
      buttons.forEach(function (b) { b.disabled = false; });
      if (err === 'cancelled') accountMessage('');
      else if (err) accountMessage(err, true);
      else accountMessage(done);
    });
  }
  function renderAccount() {
    var a = accountState(), intro = accountEl.querySelector('.intro'), actions = accountEl.querySelector('.actions');
    actions.textContent = '';
    if (!a || !a.available) {
      intro.textContent = 'Accounts need a connection to the multiplayer server.';
    } else if (!a.signedIn) {
      intro.textContent = 'Sign in with a passkey to choose your own name, and to keep your road ' +
                          'progress, settings and statistics in sync across your browsers.';
      actions.appendChild(accountButton('Sign in with a passkey', true, function () {
        passkey('login', 'Waiting for your passkey\u2026', 'Signed in.');
      }));
      actions.appendChild(accountButton('Create an account', false, function () {
        passkey('register', 'Creating a passkey for SkyRoads\u2026', 'Account created; you are signed in.');
      }));
    } else {
      var name = typeof Module.skyGhostName === 'function' ? Module.skyGhostName() : '';
      intro.textContent = 'Signed in as ' + (name || 'you') + ' with ' + a.passkeys + ' passkey' +
                          (a.passkeys === 1 ? '' : 's') + '. Your progress, settings and statistics are kept in sync.';
      actions.appendChild(accountButton('Add another passkey', false, function () {
        passkey('register', 'Creating another passkey\u2026', 'Passkey added.');
      }));
      actions.appendChild(accountButton('Sign out', false, function () {
        Module.skySignOut();
        accountMessage('Signed out.');
      }));
    }
  }
  window.skyAccountChanged = function () {
    updateAccountItem();
    updateNameItem();
    if (!signedIn()) closeNameForm();
    if (accountEl.open) renderAccount();
  };
  function openAccount(message) {
    setMenuOpen(false);
    accountMessage(message || '');
    renderAccount();
    accountEl.showModal();
  }
  accountItemEl.addEventListener('click', function () { openAccount(); });
  accountEl.querySelector('.close').addEventListener('click', function () { accountEl.close(); });
  accountEl.addEventListener('click', function (e) { if (e.target === accountEl) accountEl.close(); });
  accountEl.addEventListener('keydown', function (e) { e.stopPropagation(); });   // not game input
  accountEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  accountEl.addEventListener('close', function () { canvas.focus(); });

  // Congratulations when a finish sets the road's all-time record or your
  // personal best (the relay sends {t: 'record', ...}, see live-ghosts.js).
  var congratsEl = document.getElementById('congrats');
  function congratsText(sel, text) { congratsEl.querySelector(sel).textContent = text; }
  window.skyRecord = function (m) {
    var road = (m.road | 0), overall = !!m.overall, prev = '';
    var me = typeof Module.skyGhostName === 'function' ? Module.skyGhostName() : null;
    congratsEl.classList.toggle('overall', overall);
    congratsText('.badge', overall ? 'All-time record' : 'Personal best');
    congratsText('.kind', overall && m.personal ? 'A new all-time record, and your personal best!'
                          : overall ? 'You set a new all-time record!' : 'You beat your personal best!');
    congratsText('.road', WORLDS[road / 3 | 0] + ' \u00b7 Road ' + (road % 3 + 1));
    congratsText('.time', laptime(m.seconds));
    if (overall) {
      var po = m.previous_overall;
      prev = po ? 'Previous record ' + laptime(po[0]) + (po[1] === me ? ' (yours).' : ' by ' + po[1] + '.')
                : 'The first finish on this road.';
      if (m.personal && !(po && po[1] === me))
        prev += ' Your previous best ' + laptime(m.previous_personal) + '.';
    } else {
      prev = 'Your previous best ' + laptime(m.previous_personal) + '.';
      if (m.previous_overall) prev += ' Record: ' + laptime(m.previous_overall[0]) + ' by ' + m.previous_overall[1] + '.';
    }
    congratsText('.prev', prev);
    if (!congratsEl.open) congratsEl.showModal();
    document.getElementById('congrats-ok').focus();
  };
  document.getElementById('congrats-ok').addEventListener('click', function () { congratsEl.close(); });
  congratsEl.addEventListener('click', function (e) { if (e.target === congratsEl) congratsEl.close(); });
  congratsEl.addEventListener('keydown', function (e) {
    e.stopPropagation();                              // not game input
    if (e.key === 'Enter') { e.preventDefault(); congratsEl.close(); }
  });
  congratsEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  congratsEl.addEventListener('close', function () { canvas.focus(); });

  // Your multiplayer name: the relay's random two words, or one you choose
  // (signed in only: a chosen name belongs to your account).
  var nameItemEl = document.getElementById('name-item');
  var nameFormEl = document.getElementById('name-form');
  var nameInputEl = document.getElementById('name-input');
  var nameMsgEl = document.getElementById('name-msg');
  var NAME_RULES = '3\u201320 letters, numbers or dashes; starts and ends with a letter or number, ' +
                   'no double dashes. Empty: a random name.';
  function updateNameItem() {
    var available = typeof Module.skyGhostName === 'function' &&
                    Module.skyGhostMultiplayer();   // names are for multiplayer
    nameItemEl.hidden = !available || !nameFormEl.hidden;
    if (!available) return;
    var n = Module.skyGhostName();
    nameItemEl.querySelector('.state').textContent = n || 'random';
    nameItemEl.title = signedIn() ? (n || '') : 'Sign in to choose your own name';
  }
  function signedIn() { var a = accountState(); return !!(a && a.signedIn); }
  window.skyNameChanged = function () {
    updateNameItem();
    if (accountEl.open) renderAccount();             // "Signed in as <name>"
  };
  function nameMessage(text, error) {
    nameMsgEl.textContent = text;
    nameMsgEl.classList.toggle('error', !!error);
  }
  function closeNameForm() {
    if (nameFormEl.hidden) return;
    nameFormEl.hidden = true;
    updateNameItem();
  }
  nameItemEl.addEventListener('click', function () {
    var a = accountState();
    if (!signedIn()) {
      if (a && a.available) openAccount('Create an account or sign in to choose your own name.');
      return;
    }
    nameFormEl.hidden = false;
    nameItemEl.hidden = true;
    nameInputEl.value = Module.skyGhostChosenName() || Module.skyGhostName() || '';
    nameMessage(NAME_RULES, false);
    nameInputEl.focus();
    nameInputEl.select();
  });
  nameInputEl.addEventListener('keydown', function (e) {
    e.stopPropagation();                // typing is not game input
    if (e.key === 'Escape') { e.preventDefault(); setMenuOpen(false); }
  });
  nameInputEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  nameInputEl.addEventListener('keypress', function (e) { e.stopPropagation(); });
  nameInputEl.addEventListener('input', function () {
    var v = nameInputEl.value.trim();
    if (Module.skyGhostNameValid(v)) nameMessage(NAME_RULES, false);
    else nameMessage(NAME_RULES, true);
  });
  nameFormEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = nameInputEl.value.trim();
    if (!Module.skyGhostNameValid(v)) { nameMessage(NAME_RULES, true); return; }
    nameMessage('Saving\u2026', false);
    Module.skyGhostSetName(v, function (err) {
      if (!err) { setMenuOpen(false); return; }
      nameMessage(err === 'taken' ? 'That name is already taken.' :
                  err === 'account' ? 'Sign in to choose your own name.' :
                  err === 'offline' ? 'Could not reach the server; try again.' : NAME_RULES, true);
      nameInputEl.focus();
    });
  });

  var Module = {
    canvas: canvas,
    // debug hooks: ?SKY_AUTOKEYS=0d,0d&SKY_WARP=12 etc. become environment variables
    preRun: [function () {
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (k.indexOf('SKY_') === 0) Module.ENV[k] = v;
      });
    }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      if (t) statusEl.textContent = t.replace(/\(.*\)/, '').trim() || 'Loading…';
    },
    onGameStarted: function () {
      statusEl.style.display = 'none';
      canvas.focus();
      // follow the game's sound setting (it loads skyroads.cfg at start-up)
      clearInterval(earlyMute);
      syncSound();
      setInterval(syncSound, 300);
      applyWide();
      applyVolume();
    },
    onGameExit: function () {
      statusEl.style.display = 'block';
      statusEl.style.cursor = 'pointer';
      statusEl.textContent = 'Thanks for playing! Click to play again.';
      statusEl.onclick = function () { location.reload(); };
    }
  };
  if (!window.crossOriginIsolated) statusEl.textContent = 'Enabling threads…';
  window.onerror = function (msg) {
    statusEl.style.display = 'block';
    statusEl.textContent = 'Error: ' + msg;
  };
</script>
<script src="relay.js"></script>
<script src="live-ghosts.js"></script>
{{{ SCRIPT }}}
</body>
</html>
