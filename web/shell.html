<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyRoads</title>
<link rel="icon" href="data:,">
<!-- Re-serves the page with COOP/COEP headers on hosts that cannot set them
     (needed for SharedArrayBuffer / WebAssembly threads). -->
<script src="coi-serviceworker.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9cf;
               font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center;
          justify-content: center; }
  canvas { display: block; outline: none; image-rendering: pixelated;
           width: min(100vw, calc(100vh * 4 / 3)); height: auto; aspect-ratio: 4 / 3; }
  .chip { position: absolute; background: rgba(10, 20, 35, .85); color: #9cf;
          border: 1px solid #357; border-radius: 4px; padding: 4px 10px; }
  #status { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 16px; }
  #settings { position: absolute; right: 10px; bottom: 10px; display: flex;
              flex-direction: column; align-items: flex-end; gap: 6px; }
  #settings .chip { position: static; }
  #bar { display: flex; gap: 6px; }
  #gear, .quick { cursor: pointer; font-size: 16px; line-height: 1; padding: 6px 8px; display: flex; }
  #gear { opacity: .5; }
  #gear svg { width: 18px; height: 18px; fill: currentColor; transition: transform .2s; }
  /* sound / full screen toggles shown next to the gear while the menu is open */
  .quick { display: none; }
  #settings.open .quick { display: flex; }
  .quick svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
               stroke-linecap: round; stroke-linejoin: round; }
  .quick:hover, .quick:focus-visible { background: #234; }
  .quick:not(.on) .i-on, .quick.on .i-off { display: none; }
  #gear:hover, #settings.open #gear { opacity: 1; }
  #settings.open #gear svg { transform: rotate(60deg); }
  #menu { display: none; flex-direction: column; padding: 4px; min-width: 150px; }
  #settings.open #menu { display: flex; }
  #menu button { all: unset; cursor: pointer; padding: 6px 8px; border-radius: 3px;
                 display: flex; justify-content: space-between; gap: 16px; }
  #menu button:hover, #menu button:focus-visible { background: #234; }
  #menu .state { opacity: .7; }
  #menu button[hidden], #menu form[hidden], #menu .info[hidden] { display: none; }
  #menu .info { padding: 6px 8px; display: flex; justify-content: space-between; gap: 16px; }
  #menu .state { max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #name-form { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px 8px; }
  #name-form .row { display: flex; gap: 6px; }
  #name-input { flex: 1; min-width: 0; width: 11em; font: inherit; color: #dde; background: #0b1524;
                border: 1px solid #357; border-radius: 3px; padding: 4px 6px; outline: none; }
  #name-input:focus { border-color: #6af; }
  #name-form button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 3px; background: #234; }
  #name-form button:hover, #name-form button:focus-visible { background: #2c4a6e; }
  #name-msg { font-size: 11px; opacity: .8; max-width: 15em; }
  #name-msg.error { color: #f99; opacity: 1; }
  #screen { position: relative; }
  /* players on this road (live ghosts), over the top left of the game */
  #players { position: absolute; left: 1.5%; top: 2%; margin: 0; padding: .35em .6em;
             list-style: none; display: none; pointer-events: none;
             background: rgba(5, 10, 20, .55); border-radius: 4px;
             font: 600 clamp(9px, calc(min(100vw, 133.33vh) * .018), 16px)/1.45 ui-monospace, Menlo, Consolas, monospace;
             color: #dde; text-shadow: 0 1px 2px #000; }
  #players.show { display: block; }
  #players li { display: flex; align-items: center; gap: .5em; white-space: nowrap; }
  #players .dot { width: .75em; height: .75em; border-radius: 50%; flex: none;
                  box-shadow: 0 0 0 1px rgba(0, 0, 0, .6); }
  #players .you { opacity: .75; }
  /* wide windows: beside the game, left of its edge (see placePlayers) */
  #players.outside { left: auto; right: calc(100% + 12px); top: 12px;
                     font-size: 14px; background: rgba(10, 20, 35, .85); border: 1px solid #357; }
  /* statistics modal */
  #stats { width: min(600px, calc(100vw - 32px)); max-height: 85vh; padding: 0; overflow: hidden;
           background: #0b1524; color: #cde; border: 1px solid #357; border-radius: 6px;
           font: 13px/1.4 system-ui, sans-serif; }
  #stats[open] { display: flex; flex-direction: column; }
  #stats::backdrop { background: rgba(0, 0, 0, .6); }
  #stats header { display: flex; align-items: center; justify-content: space-between;
                  padding: 10px 14px; border-bottom: 1px solid #357; }
  #stats h2 { margin: 0; font-size: 16px; color: #9cf; }
  #stats-close { all: unset; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 6px;
                 border-radius: 3px; }
  #stats-close:hover, #stats-close:focus-visible { background: #234; }
  #stats-body { padding: 12px 14px 14px; overflow: auto; }
  #stats .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                  gap: 10px; margin-bottom: 12px; }
  #stats .card { border: 1px solid #2a3f5c; border-radius: 4px; padding: 8px 10px; }
  #stats h3 { margin: 0 0 6px; font-size: 13px; color: #9cf; }
  #stats dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  #stats dt { opacity: .75; }
  #stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #stats table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #stats th, #stats td { padding: 3px 6px; text-align: right; white-space: nowrap; }
  #stats th { color: #9cf; font-weight: 600; }
  #stats thead tr:first-child th { border-bottom: 1px solid #2a3f5c; }
  #stats thead tr:last-child th { font-weight: 400; opacity: .75; border-bottom: 1px solid #357; }
  #stats td.world { text-align: left; color: #9cf; }
  #stats td.road { text-align: left; opacity: .75; }
  #stats tbody tr.first td { border-top: 1px solid #1c2d44; }
  #stats td.zero { opacity: .35; }
  #stats .note { margin: 0; opacity: .8; }
  #help { margin: 4px 0 0; padding: 6px 8px 4px; border-top: 1px solid #357;
          display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12px; }
  #help dt { opacity: .7; }
  #help dd { margin: 0; }
</style>
</head>
<body>
<div id="wrap"><div id="screen">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <ul id="players" aria-label="Players on this road"></ul>
</div></div>
<div id="status" class="chip">Loading…</div>
<dialog id="stats" aria-labelledby="stats-title">
  <header><h2 id="stats-title">Statistics</h2>
    <button id="stats-close" aria-label="Close">&times;</button></header>
  <div id="stats-body"></div>
</dialog>
<div id="settings">
  <div id="menu" class="chip" role="menu">
    <button id="fs" role="menuitemcheckbox">Full screen <span class="state"></span></button>
    <button id="mute" role="menuitemcheckbox">Sound <span class="state"></span></button>
    <button id="multi" role="menuitemcheckbox" hidden>Multiplayer <span class="state"></span></button>
    <div id="online" class="info" hidden>Players online <span class="state"></span></div>
    <button id="name-item" role="menuitem" hidden>Name <span class="state"></span></button>
    <button id="stats-item" role="menuitem" hidden>Statistics</button>
    <form id="name-form" hidden autocomplete="off">
      <div class="row">
        <input id="name-input" maxlength="20" spellcheck="false" autocapitalize="off"
               placeholder="random name" aria-label="Your name" aria-describedby="name-msg">
        <button type="submit">Save</button>
      </div>
      <div id="name-msg"></div>
    </form>
    <dl id="help">
      <dt>←&nbsp;→</dt><dd>Steer</dd>
      <dt>↑&nbsp;↓</dt><dd>Speed</dd>
      <dt>Space</dt><dd>Jump</dd>
      <dt>Enter</dt><dd>Select</dd>
      <dt>Esc</dt><dd>Back</dd>
    </dl>
  </div>
  <div id="bar">
  <button id="q-fs" class="chip quick" aria-label="Full screen" aria-pressed="false">
    <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5"/><path d="M16 3h5v5"/><path d="M21 16v5h-5"/><path d="M8 21H3v-5"/></svg>
    <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3"/><path d="M21 8h-5V3"/><path d="M16 21v-5h5"/><path d="M3 16h5v5"/></svg>
  </button>
  <button id="q-mute" class="chip quick" aria-label="Sound" aria-pressed="true">
    <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
  </button>
  <button id="gear" class="chip" title="Settings" aria-label="Settings" aria-haspopup="menu"
          aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
</div>
<script>
  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('canvas');

  function audioContext() { return Module.SDL2 && Module.SDL2.audioContext; }

  // SDL resumes audio by itself once the page has seen a user gesture; this
  // just does it immediately.
  // typing in a field or using the statistics dialog: not game input
  function typing(e) {
    return !!(e.target && (e.target.tagName === 'INPUT' ||
                           (e.target.closest && e.target.closest('dialog'))));
  }
  function unlockAudio(e) {
    var ac = audioContext();
    if (ac && ac.state !== 'running') ac.resume();
    if (!typing(e)) canvas.focus();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, unlockAudio, true);
  });
  window.addEventListener('keydown', function (e) {
    // keep arrows / space from scrolling the page
    if (!typing(e) && [32, 37, 38, 39, 40].indexOf(e.keyCode) >= 0) e.preventDefault();
  }, true);

  // ---- settings menu: full screen, sound, multiplayer ----
  var settingsEl = document.getElementById('settings');
  var gearEl = document.getElementById('gear');
  var fsEl = document.getElementById('fs');
  var muteEl = document.getElementById('mute');
  var qFsEl = document.getElementById('q-fs');
  var qMuteEl = document.getElementById('q-mute');
  var muted = false;             // mirrors the game's own sound setting

  function setMenuOpen(open) {
    if (!open) closeNameForm();
    settingsEl.classList.toggle('open', open);
    gearEl.setAttribute('aria-expanded', open);
    if (!open) canvas.focus();  // keep Space/Enter going to the game, not a button
  }
  gearEl.addEventListener('click', function (e) {
    e.stopPropagation();
    updateMultiItem();
    updateOnlineItem();
    updateNameItem();
    statsItemEl.hidden = typeof Module.skyGhostStats !== 'function' ||
                         !Module.skyGhostMultiplayer();     // kept by the relay
    setMenuOpen(!settingsEl.classList.contains('open'));
  });
  document.addEventListener('click', function (e) {
    if (!settingsEl.contains(e.target)) setMenuOpen(false);
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFsItem() {
    var on = isFullscreen();
    fsEl.querySelector('.state').textContent = on ? 'On' : 'Off';
    fsEl.setAttribute('aria-checked', on);
    qFsEl.classList.toggle('on', on);
    qFsEl.setAttribute('aria-pressed', on);
    qFsEl.title = on ? 'Exit full screen' : 'Full screen';
  }
  function toggleFullscreen() {
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }
  fsEl.addEventListener('click', function () {
    toggleFullscreen();
    setMenuOpen(false);
  });
  qFsEl.addEventListener('click', function () {
    toggleFullscreen();
    setMenuOpen(false);
  });
  document.addEventListener('fullscreenchange', updateFsItem);
  document.addEventListener('webkitfullscreenchange', updateFsItem);

  // Sound is the game's own setting (Controls screen, saved in skyroads.cfg):
  // the menu asks the game to switch it (applied on the game thread, see
  // sound_poll in port/runtime.c) and follows it, so changing it in the
  // Controls screen updates the menu too.
  var soundWanted = null;       // requested, not yet applied by the game
  function gameSoundOn() {
    return typeof Module._sky_sound_on === 'function' ? !!Module._sky_sound_on() : !muted;
  }
  function syncSound() {
    var on = gameSoundOn();
    if (soundWanted !== null) {
      if (on === soundWanted) soundWanted = null;
      else on = soundWanted;    // show the request until the game applies it
    }
    if (muted !== !on) { muted = !on; updateMuteItem(); }
  }
  function updateMuteItem() {
    muteEl.querySelector('.state').textContent = muted ? 'Off' : 'On';
    muteEl.setAttribute('aria-checked', !muted);
    qMuteEl.classList.toggle('on', !muted);
    qMuteEl.setAttribute('aria-pressed', !muted);
    qMuteEl.title = muted ? 'Sound off' : 'Sound on';
  }
  function toggleMute() {
    muted = !muted;
    soundWanted = !muted;
    if (typeof Module._sky_set_sound === 'function') Module._sky_set_sound(muted ? 0 : 1);
    updateMuteItem();
  }
  muteEl.addEventListener('click', function () {
    toggleMute();
    setMenuOpen(false);
  });
  qMuteEl.addEventListener('click', function () {
    toggleMute();
    setMenuOpen(false);
  });
  updateFsItem();
  updateMuteItem();

  // Multiplayer (live ghosts of other players, see live-ghosts.js) or single
  // player (no connection, no ghosts).  Only offered when a relay is
  // configured.
  var multiEl = document.getElementById('multi');
  function updateMultiItem() {
    var available = typeof Module.skyGhostMultiplayer === 'function';
    multiEl.hidden = !available;
    if (!available) return;
    var on = Module.skyGhostMultiplayer();
    multiEl.querySelector('.state').textContent = on ? 'On' : 'Off';
    multiEl.setAttribute('aria-checked', on);
  }
  multiEl.addEventListener('click', function () {
    Module.skyGhostSetMultiplayer(!Module.skyGhostMultiplayer());
    updateMultiItem();
    setMenuOpen(false);
  });

  // The player list goes left of the game when the space beside it is wide
  // enough (live-ghosts.js calls this when the list changes), else over the
  // game's top left corner.
  var playersEl = document.getElementById('players');
  function placePlayers() {
    if (!playersEl.classList.contains('show')) return;
    playersEl.classList.add('outside');           // measure it in that style
    if (canvas.getBoundingClientRect().left < playersEl.offsetWidth + 24)
      playersEl.classList.remove('outside');
  }
  window.skyPlacePlayers = placePlayers;
  window.addEventListener('resize', placePlayers);
  document.addEventListener('fullscreenchange', placePlayers);

  // How many players are connected to the relay (only while connected).
  var onlineEl = document.getElementById('online');
  function updateOnlineItem() {
    var n = typeof Module.skyGhostOnline === 'function' ? Module.skyGhostOnline() : null;
    onlineEl.hidden = n === null;
    if (n !== null) onlineEl.querySelector('.state').textContent = String(n);
  }
  window.skyOnlineChanged = updateOnlineItem;

  // Statistics, kept by the relay (all players and you).
  var statsItemEl = document.getElementById('stats-item');
  var statsEl = document.getElementById('stats');
  var statsBodyEl = document.getElementById('stats-body');
  var WORLDS = ['Red Heat', 'Into the Sun', 'Blue Planet', 'Satellite', 'Misty',
                'Asteroid Belt', 'Crab Nebula', 'Over the Base', 'The Earth', 'Druidia'];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function num(n) { return (n | 0).toLocaleString(); }
  function duration(sec) {
    sec = Math.round(sec || 0);
    var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + s + 's' : s + 's';
  }
  function cell(n) { return '<td' + (n ? '' : ' class="zero"') + '>' + num(n) + '</td>'; }
  function renderStats(st) {
    if (!st) {
      statsBodyEl.innerHTML = '<p class="note">Statistics are kept by the multiplayer server. ' +
        'Switch Multiplayer on in the settings to see them.</p>';
      return;
    }
    var a = st.all, y = st.you, html = '<div class="cards">' +
      '<div class="card"><h3>All time</h3><dl>' +
        '<dt>Players</dt><dd>' + num(a.players) + '</dd>' +
        '<dt>Roads attempted</dt><dd>' + num(a.attempts) + '</dd>' +
        '<dt>Roads completed</dt><dd>' + num(a.completions) + '</dd>' +
        '<dt>Time playing</dt><dd>' + duration(a.seconds) + '</dd></dl></div>' +
      '<div class="card"><h3>Personal</h3><dl>' +
        '<dt>Roads attempted</dt><dd>' + num(y.attempts) + '</dd>' +
        '<dt>Roads completed</dt><dd>' + num(y.completions) + '</dd>' +
        '<dt>Time playing</dt><dd>' + duration(y.seconds) + '</dd></dl></div></div>' +
      '<table><thead><tr><th colspan="2"></th><th colspan="2">All time</th><th colspan="2">Personal</th></tr>' +
      '<tr><th colspan="2" style="text-align:left">Road</th><th>Attempts</th><th>Completed</th>' +
      '<th>Attempts</th><th>Completed</th></tr></thead><tbody>';
    for (var r = 0; r < 30; r++) {
      var ar = a.roads[r] || [0, 0], yr = y.roads[r] || [0, 0];
      html += '<tr' + (r % 3 ? '' : ' class="first"') + '>' +
        (r % 3 ? '' : '<td class="world" rowspan="3">' + esc(WORLDS[r / 3 | 0]) + '</td>') +
        '<td class="road">Road ' + (r % 3 + 1) + '</td>' +
        cell(ar[0]) + cell(ar[1]) + cell(yr[0]) + cell(yr[1]) + '</tr>';
    }
    statsBodyEl.innerHTML = html + '</tbody></table>';
  }
  statsItemEl.addEventListener('click', function () {
    setMenuOpen(false);
    statsBodyEl.innerHTML = '<p class="note">Loading\u2026</p>';
    statsEl.showModal();
    Module.skyGhostStats(renderStats);
  });
  document.getElementById('stats-close').addEventListener('click', function () { statsEl.close(); });
  statsEl.addEventListener('click', function (e) { if (e.target === statsEl) statsEl.close(); });
  statsEl.addEventListener('keydown', function (e) { e.stopPropagation(); });   // not game input
  statsEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  statsEl.addEventListener('close', function () { canvas.focus(); });

  // Your multiplayer name: the relay's random two words, or one you choose.
  var nameItemEl = document.getElementById('name-item');
  var nameFormEl = document.getElementById('name-form');
  var nameInputEl = document.getElementById('name-input');
  var nameMsgEl = document.getElementById('name-msg');
  var NAME_RULES = '3\u201320 letters, numbers or dashes; starts and ends with a letter or number, ' +
                   'no double dashes. Empty: a random name.';
  function updateNameItem() {
    var available = typeof Module.skyGhostName === 'function' &&
                    Module.skyGhostMultiplayer();   // names are for multiplayer
    nameItemEl.hidden = !available || !nameFormEl.hidden;
    if (!available) return;
    var n = Module.skyGhostName();
    nameItemEl.querySelector('.state').textContent = n || 'random';
    nameItemEl.title = n || '';
  }
  window.skyNameChanged = updateNameItem;
  function nameMessage(text, error) {
    nameMsgEl.textContent = text;
    nameMsgEl.classList.toggle('error', !!error);
  }
  function closeNameForm() {
    if (nameFormEl.hidden) return;
    nameFormEl.hidden = true;
    updateNameItem();
  }
  nameItemEl.addEventListener('click', function () {
    nameFormEl.hidden = false;
    nameItemEl.hidden = true;
    nameInputEl.value = Module.skyGhostChosenName() || Module.skyGhostName() || '';
    nameMessage(NAME_RULES, false);
    nameInputEl.focus();
    nameInputEl.select();
  });
  nameInputEl.addEventListener('keydown', function (e) {
    e.stopPropagation();                // typing is not game input
    if (e.key === 'Escape') { e.preventDefault(); setMenuOpen(false); }
  });
  nameInputEl.addEventListener('keyup', function (e) { e.stopPropagation(); });
  nameInputEl.addEventListener('keypress', function (e) { e.stopPropagation(); });
  nameInputEl.addEventListener('input', function () {
    var v = nameInputEl.value.trim();
    if (Module.skyGhostNameValid(v)) nameMessage(NAME_RULES, false);
    else nameMessage(NAME_RULES, true);
  });
  nameFormEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = nameInputEl.value.trim();
    if (!Module.skyGhostNameValid(v)) { nameMessage(NAME_RULES, true); return; }
    nameMessage('Saving\u2026', false);
    Module.skyGhostSetName(v, function (err) {
      if (!err) { setMenuOpen(false); return; }
      nameMessage(err === 'taken' ? 'Someone online already uses that name.' :
                  err === 'offline' ? 'Could not reach the server; try again.' : NAME_RULES, true);
      nameInputEl.focus();
    });
  });

  var Module = {
    canvas: canvas,
    // debug hooks: ?SKY_AUTOKEYS=0d,0d&SKY_WARP=12 etc. become environment variables
    preRun: [function () {
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (k.indexOf('SKY_') === 0) Module.ENV[k] = v;
      });
    }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      if (t) statusEl.textContent = t.replace(/\(.*\)/, '').trim() || 'Loading…';
    },
    onGameStarted: function () {
      statusEl.style.display = 'none';
      canvas.focus();
      // follow the game's sound setting (it loads skyroads.cfg at start-up)
      syncSound();
      setInterval(syncSound, 300);
    },
    onGameExit: function () {
      statusEl.style.display = 'block';
      statusEl.style.cursor = 'pointer';
      statusEl.textContent = 'Thanks for playing! Click to play again.';
      statusEl.onclick = function () { location.reload(); };
    }
  };
  if (!window.crossOriginIsolated) statusEl.textContent = 'Enabling threads…';
  window.onerror = function (msg) {
    statusEl.style.display = 'block';
    statusEl.textContent = 'Error: ' + msg;
  };
</script>
<script src="relay.js"></script>
<script src="live-ghosts.js"></script>
